<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stackdraft: draft a system from parts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --paper: #E6EAEE; --grid: rgba(23,35,58,.065); --surface: #F7F9FA; --sunk: #EEF1F4;
  --ink: #17233A; --muted: #556174; --line: #C3CBD5; --line-strong: #8B97A7;
  --accent: #0D7666; --accent-ink: #FFFFFF; --warn: #8E5200;
  --l-client: #3361C6; --l-edge: #7A4DC3; --l-app: #0D7666; --l-data: #B0631A; --l-async: #B33A6D; --l-ops: #5A6778;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11171F; --grid: rgba(190,210,235,.05); --surface: #19212B; --sunk: #151C25;
    --ink: #E2E7ED; --muted: #98A3B2; --line: #2B3543; --line-strong: #4C596B;
    --accent: #3CC1AC; --accent-ink: #08201C; --warn: #E6AE4A;
    --l-client: #7EA1EF; --l-edge: #B293EA; --l-app: #3CC1AC; --l-data: #E3A25B; --l-async: #E57EA7; --l-ops: #A3AEBE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11171F; --grid: rgba(190,210,235,.05); --surface: #19212B; --sunk: #151C25;
  --ink: #E2E7ED; --muted: #98A3B2; --line: #2B3543; --line-strong: #4C596B;
  --accent: #3CC1AC; --accent-ink: #08201C; --warn: #E6AE4A;
  --l-client: #7EA1EF; --l-edge: #B293EA; --l-app: #3CC1AC; --l-data: #E3A25B; --l-async: #E57EA7; --l-ops: #A3AEBE;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; font-family: var(--sans); color: var(--ink); background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; font-size: 16px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 64px; }

header.top { padding: 36px 0 20px; display: grid; gap: 18px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 {
  margin: 0; font-weight: 800; font-stretch: 68%; font-size: clamp(2.6rem, 7vw, 4.6rem);
  line-height: .9; letter-spacing: -.01em;
}
.brand p { margin: 0; color: var(--muted); max-width: 46ch; font-size: 1.02rem; }
nav.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
nav.tabs button {
  border: 0; background: transparent; padding: 10px 16px 9px; cursor: pointer; font-weight: 600;
  font-stretch: 88%; font-size: 1.05rem; color: var(--muted); border-radius: 6px 6px 0 0;
}
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
nav.tabs button:hover:not([aria-selected="true"]) { color: var(--ink); }

.view[hidden] { display: none; }
h2 { font-stretch: 80%; font-weight: 750; font-size: 1.6rem; line-height: 1.1; margin: 0 0 6px; }
h3 { font-stretch: 90%; font-weight: 700; font-size: 1.05rem; margin: 0; }
.lede { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }

/* Build */
.build { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 24px; align-items: start; margin-top: 24px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.meta { padding: 16px; display: grid; gap: 12px; }
label.field { display: grid; gap: 4px; font-size: .88rem; font-weight: 600; }
.field input, .field textarea {
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--sunk); font-weight: 400; font-size: .95rem;
}
.field textarea { min-height: 64px; resize: vertical; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--sunk); padding: 7px 4px; cursor: pointer; font-size: .88rem; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg-hint { font-size: .82rem; color: var(--muted); font-weight: 400; }

.catalog { margin-top: 16px; display: grid; gap: 18px; }
.layer-group h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.layer-group h3::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.layer-group h3 span { font-weight: 400; color: var(--muted); font-size: .85rem; font-stretch: 100%; }
.parts { display: grid; gap: 6px; }
.part {
  display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 10px; align-items: start; text-align: left;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; cursor: pointer;
}
.part:hover { border-color: var(--line-strong); }
.part .box { grid-row: span 2; width: 16px; height: 16px; margin-top: 2px; border: 1.5px solid var(--line-strong); border-radius: 4px; display: grid; place-items: center; }
.part[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
.part[aria-pressed="true"] .box { background: var(--c); border-color: var(--c); }
.part[aria-pressed="true"] .box::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.part-name { font-weight: 650; font-size: .95rem; }
.part-desc { grid-column: 2 / 4; color: var(--muted); font-size: .84rem; line-height: 1.35; }
.badge { font-size: .72rem; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-weight: 600; }
.badge.runs { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent); }

/* Drawing sheet */
.sheet-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; }
.sheet { background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; padding: 18px; position: relative; }
.sheet-inner { border: 1px solid var(--line-strong); padding: 10px 14px 14px; }
.lane { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 12px 0; position: relative; }
.lane + .lane { border-top: 1px dashed var(--line); }
.lane-label { font-weight: 750; font-stretch: 78%; font-size: 1.05rem; color: var(--c); line-height: 1.15; padding-top: 6px; }
.lane-label small { display: block; color: var(--muted); font-weight: 400; font-stretch: 100%; font-size: .75rem; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; min-height: 38px; }
.chip {
  border: 1.5px solid var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface));
  border-radius: 6px; padding: 6px 10px; font-weight: 650; font-size: .9rem; display: inline-flex; align-items: center; gap: 8px;
}
.chip button { border: 0; background: transparent; cursor: pointer; padding: 0 2px; color: var(--muted); font-size: 1rem; line-height: 1; }
.chip button:hover { color: var(--ink); }
.chip.auto { border-style: dashed; }
.empty-lane { border: 1.5px dashed var(--line); color: var(--muted); border-radius: 6px; padding: 7px 10px; font-size: .85rem; }
.titleblock { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; border: 1px solid var(--line-strong); border-top: 0; font-size: .8rem; }
.titleblock div { padding: 6px 10px; border-right: 1px solid var(--line-strong); min-width: 0; }
.titleblock div:last-child { border-right: 0; }
.titleblock span { display: block; color: var(--muted); font-size: .7rem; }
.titleblock strong { display: block; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notes { padding: 14px 16px; }
.notes ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: .9rem; }
.notes li { margin: 4px 0; }
.notes li.warn { color: var(--warn); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1.5px solid var(--ink); background: var(--surface); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 650; font-size: .92rem;
}
.btn.primary { background: var(--ink); color: var(--paper); }
.btn:hover { border-color: var(--accent); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Examples */
.ex-head { display: flex; justify-content: space-between; gap: 16px; align-items: end; flex-wrap: wrap; margin-top: 24px; }
.ex-head .seg { min-width: 300px; }
.ex { display: grid; grid-template-columns: 280px 1fr; gap: 24px; margin-top: 18px; align-items: start; }
.ex-list { display: grid; gap: 6px; }
.ex-tier { font-weight: 750; font-stretch: 80%; font-size: 1rem; margin: 10px 0 2px; color: var(--muted); }
.ex-item { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.ex-item strong { display: block; font-size: .98rem; }
.ex-item span { color: var(--muted); font-size: .84rem; }
.ex-item[aria-current="true"] { border-color: var(--ink); box-shadow: inset 4px 0 0 var(--ink); }
.ex-detail { padding: 22px; }
.ex-detail .scale { color: var(--muted); margin: 2px 0 14px; }
.ex-lanes .lane-label { padding-top: 2px; }
.ex-lanes ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ex-lanes li { font-size: .92rem; line-height: 1.4; }
.ex-lanes li strong { font-weight: 650; }
.ex-lanes li span { color: var(--muted); }
.hosting { background: var(--sunk); border-radius: 8px; padding: 12px 14px; margin: 14px 0; font-size: .93rem; }
.hosting h3 { margin-bottom: 4px; }
.source { color: var(--muted); font-size: .82rem; margin: 0 0 14px; }

/* Export */
.export { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; align-items: start; }
.export .panel { padding: 18px; display: grid; gap: 12px; }
.stackline { font-size: .92rem; color: var(--muted); }
.stackline strong { color: var(--ink); }
pre.code {
  margin: 0; font-family: var(--mono); font-size: .8rem; line-height: 1.5; background: var(--sunk);
  border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow: auto; max-height: 460px; white-space: pre;
}
pre.prompt { white-space: pre-wrap; }
.files { display: grid; grid-template-columns: 200px 1fr; gap: 10px; min-height: 300px; }
.filelist { display: grid; gap: 2px; align-content: start; max-height: 460px; overflow: auto; }
.filelist button { text-align: left; border: 0; background: transparent; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-family: var(--mono); font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
.filelist button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.filelist button:hover:not([aria-current="true"]) { color: var(--ink); background: var(--sunk); }
.status { font-size: .88rem; color: var(--muted); min-height: 1.3em; margin: 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.included { margin: 0; padding-left: 18px; font-size: .9rem; }
.included li { margin: 2px 0; }
.included .muted { color: var(--muted); }
.empty-state { padding: 40px 20px; text-align: center; color: var(--muted); }

@media (max-width: 920px) {
  .build, .ex, .export { grid-template-columns: 1fr; }
  .sheet-col { position: static; order: -1; }
  .ex-list { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .ex-tier { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 12px 48px; }
  .lane { grid-template-columns: 1fr; gap: 6px; }
  .titleblock { grid-template-columns: 1fr 1fr; }
  .titleblock div:nth-child(2) { border-right: 0; }
  .titleblock div:nth-child(-n+2) { border-bottom: 1px solid var(--line-strong); }
  .files { grid-template-columns: 1fr; }
  .filelist { max-height: 160px; }
  .sheet { padding: 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .chip.fresh { animation: drop .28s ease-out; }
  @keyframes drop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Stackdraft</h1>
      <p>Pick the parts your system needs, see how real platforms are put together, then export a prompt or a project you can run today.</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-build" aria-controls="view-build" aria-selected="true" data-view="build">Build</button>
      <button role="tab" id="tab-examples" aria-controls="view-examples" aria-selected="false" data-view="examples">Reference systems</button>
      <button role="tab" id="tab-export" aria-controls="view-export" aria-selected="false" data-view="export">Export</button>
    </nav>
  </header>

  <section class="view" id="view-build" role="tabpanel" aria-labelledby="tab-build">
    <div class="build">
      <div>
        <div class="panel meta">
          <label class="field">Project name
            <input id="f-name" maxlength="60" autocomplete="off">
          </label>
          <div class="field" role="group" aria-labelledby="scale-label">
            <span id="scale-label">Scale</span>
            <div class="seg" id="f-scale"></div>
            <span class="seg-hint" id="scale-hint"></span>
          </div>
          <label class="field">What does it do?
            <textarea id="f-desc" maxlength="600" placeholder="A place for parents to sign up for school volunteer shifts"></textarea>
          </label>
        </div>
        <div class="catalog" id="catalog"></div>
      </div>
      <div class="sheet-col">
        <div class="sheet" aria-label="System drawing">
          <div class="sheet-inner" id="drawing"></div>
          <div class="titleblock" id="titleblock"></div>
        </div>
        <div class="panel notes" id="notes"></div>
        <div class="row-actions">
          <button class="btn primary" data-goto="export">Export this system</button>
          <button class="btn" id="clear">Clear parts</button>
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="view-examples" role="tabpanel" aria-labelledby="tab-examples" hidden>
    <div class="ex-head">
      <div>
        <h2>How real systems are built</h2>
        <p class="lede" style="margin:0">From global platforms down to a one-person site. Open any of them in the builder to use as a starting point.</p>
      </div>
      <div class="seg" id="tier-filter"></div>
    </div>
    <div class="ex">
      <div class="ex-list" id="ex-list"></div>
      <div class="panel ex-detail" id="ex-detail"></div>
    </div>
  </section>

  <section class="view" id="view-export" role="tabpanel" aria-labelledby="tab-export" hidden>
    <div id="export-root"></div>
  </section>
</div>

<script>
// ===================== DATA =====================
const LAYERS = [
  { id: 'client', name: 'Clients', hint: 'What people open' },
  { id: 'edge', name: 'Edge', hint: 'Between the internet and your code' },
  { id: 'app', name: 'Application', hint: 'Your code and the services it calls' },
  { id: 'data', name: 'Data', hint: 'Where state lives' },
  { id: 'async', name: 'Background', hint: 'Work that happens later' },
  { id: 'ops', name: 'Operations', hint: 'Ship it, run it, watch it' },
];
const SCALES = [
  { id: 'solo', name: 'Solo', hint: 'One person, up to a few thousand visitors a month.' },
  { id: 'small', name: 'Small', hint: '2–10 people, thousands of users.' },
  { id: 'medium', name: 'Medium', hint: 'An established business, tens of thousands to a million users.' },
  { id: 'large', name: 'Large', hint: 'Millions of users, many teams, multiple regions.' },
];
const P = (id, name, layer, run, desc, host) => ({ id, name, layer, run, desc, host });
const PARTS = [
  P('static', 'Static site', 'client', true, 'Plain HTML, CSS and JavaScript. No build step.', 'Cloudflare Pages, Netlify, or GitHub Pages'),
  P('react', 'React single-page app', 'client', true, 'A Vite + React app that talks to your API.', 'Build it into the API’s public folder so one service serves both, or Cloudflare Pages'),
  P('nextjs', 'Next.js app', 'client', true, 'React with server rendering and routing.', 'Vercel or Netlify, with API_ORIGIN pointing at your API'),
  P('mobile', 'Mobile apps', 'client', false, 'Native iOS and Android clients.', 'Expo / React Native, shipped through the App Store and Google Play'),
  P('dns', 'Domain, DNS and TLS', 'edge', false, 'Your domain name and HTTPS certificates.', 'Cloudflare or your registrar; TLS is automatic on most hosts, or Caddy on a VPS'),
  P('cdn', 'CDN', 'edge', false, 'Caches files close to users around the world.', 'Cloudflare, Fastly, or Amazon CloudFront'),
  P('lb', 'Load balancer / reverse proxy', 'edge', false, 'Spreads traffic across app instances and handles HTTPS.', 'Built into PaaS hosts; Caddy or Nginx on a VPS; AWS ALB at scale'),
  P('gateway', 'API gateway', 'edge', false, 'One front door for many services: routing, auth, rate limits.', 'Kong, AWS API Gateway, or Envoy'),
  P('waf', 'WAF and DDoS protection', 'edge', false, 'Filters malicious traffic before it reaches you.', 'Cloudflare or AWS WAF'),
  P('express', 'Node.js + Express', 'app', true, 'JavaScript server for your API.', 'Render, Railway, or Fly.io (Dockerfile included)'),
  P('fastapi', 'Python + FastAPI', 'app', true, 'Typed Python API with automatic docs at /docs.', 'Render, Railway, or Fly.io (Dockerfile included)'),
  P('flask', 'Python + Flask', 'app', true, 'Small, flexible Python web app.', 'Render, Railway, or Fly.io (Dockerfile included)'),
  P('go', 'Go services', 'app', false, 'Fast compiled services for hot paths.', 'Containers on Fly.io, Amazon ECS, or Kubernetes'),
  P('realtime', 'Realtime (WebSockets)', 'app', true, 'Live updates and chat without refreshing.', 'Any host with WebSocket support (Render, Fly.io); Ably or Pusher if you want it managed'),
  P('auth', 'Authentication', 'app', false, 'Sign-in, sessions, password resets, SSO.', 'Clerk, Auth0, Supabase Auth, or a well-tested session library'),
  P('payments', 'Payments', 'app', false, 'Checkout, subscriptions and invoices.', 'Stripe, starting in test mode'),
  P('email', 'Transactional email', 'app', true, 'Receipts, resets and notifications (Mailpit locally).', 'Postmark, Resend, or Amazon SES'),
  P('ml', 'Recommendations / ML', 'app', false, 'Ranks feeds and suggests content.', 'Start with simple rules; later a model service or pgvector'),
  P('sqlite', 'SQLite', 'data', true, 'A database in one file. Great for solo projects.', 'A persistent volume on Fly.io or a VPS, or Turso'),
  P('postgres', 'PostgreSQL', 'data', true, 'The default relational database for most apps.', 'Neon, Supabase, Render Postgres, or Amazon RDS'),
  P('mysql', 'MySQL', 'data', true, 'Widely hosted relational database.', 'PlanetScale, Amazon RDS, or DigitalOcean Managed MySQL'),
  P('mongodb', 'MongoDB', 'data', true, 'Document database for flexible records.', 'MongoDB Atlas'),
  P('wide', 'Wide-column store', 'data', false, 'Cassandra or Bigtable-style storage for huge write volumes.', 'DataStax Astra, ScyllaDB Cloud, or Google Bigtable'),
  P('redis', 'Redis cache', 'data', true, 'In-memory cache, sessions, counters and simple queues.', 'Upstash or Redis Cloud'),
  P('search', 'Search engine', 'data', true, 'Full-text search (Meilisearch locally).', 'Meilisearch Cloud, Algolia, or OpenSearch'),
  P('objstore', 'Object storage', 'data', true, 'Files, images and video in S3-compatible buckets (MinIO locally).', 'Cloudflare R2, Amazon S3, or Backblaze B2'),
  P('worker', 'Background workers', 'async', true, 'Runs jobs outside the request, like sending email.', 'A second service on the same host, such as a Render background worker'),
  P('rabbitmq', 'Message queue (RabbitMQ)', 'async', true, 'Reliable job delivery between services.', 'CloudAMQP or Amazon MQ'),
  P('kafka', 'Event stream (Kafka)', 'async', true, 'A durable log of events many services read (Redpanda locally).', 'Confluent Cloud, Redpanda Cloud, or Amazon MSK'),
  P('cron', 'Scheduled jobs', 'async', false, 'Nightly reports, cleanups and reminders.', 'Render cron jobs, GitHub Actions schedules, or a worker loop'),
  P('media', 'Media processing', 'async', false, 'Transcodes video and resizes images after upload.', 'ffmpeg in a worker; Mux, Cloudflare Stream, or AWS MediaConvert at scale'),
  P('docker', 'Containers (Docker)', 'ops', true, 'Packages every service the same way everywhere.', 'Any container host'),
  P('k8s', 'Kubernetes', 'ops', false, 'Schedules and scales containers across many machines.', 'EKS, GKE, or DigitalOcean Kubernetes, once simpler hosts are outgrown'),
  P('ci', 'CI/CD (GitHub Actions)', 'ops', true, 'Builds and checks every push automatically.', 'GitHub Actions'),
  P('monitoring', 'Metrics and alerting', 'ops', false, 'Dashboards and alerts for latency, errors and uptime.', 'Grafana Cloud, Datadog, or Better Stack'),
  P('logging', 'Error tracking and logs', 'ops', false, 'Captures exceptions and searchable logs.', 'Sentry, Better Stack, or Axiom'),
  P('analytics', 'Product analytics', 'ops', false, 'What people actually do in your product.', 'Plausible or PostHog'),
];
const PART = Object.fromEntries(PARTS.map(p => [p.id, p]));

const EXAMPLES = [
  {
    id: 'reddit', tier: 'large', name: 'Reddit', kind: 'Community forums and feeds',
    scale: 'Hundreds of millions of monthly users, thousands of employees',
    parts: ['mobile','react','cdn','lb','gateway','waf','go','fastapi','ml','postgres','wide','redis','search','objstore','worker','rabbitmq','kafka','media','docker','k8s','ci','monitoring','logging'],

function slugify(s) { return (String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'my-system').slice(0, 48); }

function analyze(selected) {
  const has = new Set(selected);
  const notes = [];
  const added = [];
  const add = (id, why) => { if (!has.has(id)) { has.add(id); added.push(id); notes.push({ warn: false, text: why }); } };
  const pick = (order) => order.filter(id => has.has(id));

  const fronts = pick(['nextjs', 'react', 'static']);
  let frontend = fronts[0] || null;
  if (fronts.length > 1) notes.push({ warn: true, text: 'You picked more than one client framework. The starter project uses ' + PART[frontend].name + '; the others stay in the plan.' });

  const backs = pick(RUNNABLE_BACKENDS);
  let backend = backs[0] || null;
  if (backs.length > 1) notes.push({ warn: true, text: 'More than one API framework is selected. The starter project uses ' + PART[backend].name + '.' });
  if (has.has('go')) notes.push({ warn: false, text: 'Go services are described in the plan, but the starter project doesn’t include Go code yet.' });

  if (has.has('worker') && !has.has('rabbitmq') && !has.has('redis')) add('redis', 'Background workers need a queue, so Redis was added to hold jobs.');

  const needsServer = ['sqlite','postgres','mysql','mongodb','redis','search','objstore','worker','rabbitmq','kafka','realtime','email','auth','payments'].filter(id => has.has(id));
  if (!backend && (needsServer.length || has.has('go'))) {
    backend = 'express';
    add('express', 'Added Node.js + Express because ' + PART[needsServer[0] || 'go'].name + ' needs server code to talk to.');
  }
  if (has.has('k8s') && !has.has('docker')) add('docker', 'Kubernetes runs containers, so Containers (Docker) was added.');
  if (backend && !has.has('docker')) add('docker', 'The starter project runs everything with Docker Compose, so Containers (Docker) was added.');
  if (has.has('media') && !has.has('objstore')) notes.push({ warn: true, text: 'Media processing usually needs Object storage for the original and processed files.' });
  if (has.has('sqlite') && (has.has('k8s') || has.has('lb'))) notes.push({ warn: true, text: 'SQLite lives on one machine’s disk, so it doesn’t work with several app instances behind a load balancer. Consider PostgreSQL.' });
  if (has.has('kafka') && !has.has('worker')) notes.push({ warn: false, text: 'Kafka is included as a running broker; add Background workers if you want something consuming events.' });

  const dbs = pick(['postgres', 'mysql', 'mongodb', 'sqlite']);
  const primary = dbs[0] || null;
  const queue = has.has('worker') ? (has.has('rabbitmq') ? 'rabbitmq' : 'redis') : null;
  const services = ['postgres','mysql','mongodb','redis','search','objstore','rabbitmq','kafka','email'].filter(id => has.has(id));
  const port = backend === 'express' ? 3000 : 8000;
  return { has, notes, added, frontend, backend, dbs, primary, queue, services, port };
}

function composeFile(a) {
  const L = ['services:'];
  const deps = a.services.map(id => SERVICE_DEFS[id]);
  const dependsBlock = (list) => {
    if (!list.length) return [];
    const out = ['    depends_on:'];
    list.forEach(d => { out.push('      ' + d.name + ':', '        condition: ' + (d.healthy ? 'service_healthy' : 'service_started')); });
    return out;
  };
  const isNode = a.backend === 'express';
  const sqliteVol = a.has.has('sqlite') ? ['    volumes: ["sqlitedata:/data"]'] : [];
  L.push('  api:', '    build: ./api', '    env_file: .env', '    ports: ["' + a.port + ':' + a.port + '"]', ...sqliteVol, ...dependsBlock(deps));
  if (a.queue) {
    L.push('', '  worker:', '    build: ./api', '    command: ' + (isNode ? '["node", "worker.js"]' : '["python", "worker.py"]'), '    env_file: .env', ...dependsBlock(deps));
  }
  if (a.frontend === 'react') {
    L.push('', '  web:', '    image: node:20-slim', '    working_dir: /web', '    volumes: ["./web:/web", "/web/node_modules"]',
      '    command: sh -c "npm install && npm run dev"', '    environment:', '      API_TARGET: http://api:' + a.port, '    ports: ["5173:5173"]', '    depends_on: [api]');
  }
  if (a.frontend === 'nextjs') {
    L.push('', '  web:', '    image: node:20-slim', '    working_dir: /web', '    volumes: ["./web:/web", "/web/node_modules", "/web/.next"]',
      '    command: sh -c "npm install && npm run dev"', '    environment:', '      API_ORIGIN: http://api:' + a.port, '    ports: ["3001:3001"]', '    depends_on: [api]');
  }
  deps.forEach(d => { L.push(''); L.push(...d.yaml); });
  const vols = deps.map(d => d.volume).filter(Boolean);
  if (a.has.has('sqlite')) vols.push('sqlitedata');
  if (vols.length) { L.push('', 'volumes:'); vols.forEach(v => L.push('  ' + v + ':')); }
  return L.join('\n') + '\n';
}

function envFile(a, example) {
  const L = ['# ' + (example ? 'Copy to .env and change values for production. Never commit real secrets.' : 'Local development values. Safe defaults for your machine only; .env is git-ignored.'), 'PORT=' + a.port];
  if (a.has.has('sqlite')) L.push('SQLITE_PATH=/data/app.db');
  a.services.forEach(id => { L.push(''); L.push('# ' + PART[id].name); SERVICE_DEFS[id].env.forEach(([k, v]) => L.push(k + '=' + v)); });
  if (a.has.has('payments')) L.push('', '# Payments: add your Stripe test key when you wire up checkout', 'STRIPE_SECRET_KEY=sk_test_replace_me');
  if (a.has.has('auth')) L.push('', '# Authentication: provider keys go here (Clerk, Auth0, Supabase...)', 'AUTH_SECRET=replace-with-a-long-random-string');
  return L.join('\n') + '\n';
}

function ciWorkflow(a) {
  if (a.backend) return `name: CI
on: [push, pull_request]
jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build api
      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 45); do curl -fs http://localhost:${a.port}/api/health && exit 0; sleep 2; done
          docker compose logs api
          exit 1
      - name: Stop
        if: always()
        run: docker compose down -v
`;
  if (a.frontend === 'static' || !a.frontend) return `name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
`;
  return `name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
`;
}

function buildProject(state) {
  const a = analyze(state.selected);
  const project = (state.name || 'My system').trim() || 'My system';
  const slug = slugify(project);
  const files = [];
  const add = (path, content) => files.push({ path, content });

  if (!a.backend) {
    if (a.frontend === 'react') addVite(a, add, project);
    else if (a.frontend === 'nextjs') addNext(a, add, project);
    else { const s = staticDemo(a, project); add('site/index.html', s.html); add('site/style.css', s.css); }
  } else {
    if (a.backend === 'express') {
      add('api/package.json', nodePackage(a, slug));
      add('api/server.js', nodeServer(a, project));
      if (a.queue) add('api/worker.js', nodeWorker(a));
      add('api/Dockerfile', 'FROM node:20-slim\nWORKDIR /app\nCOPY package.json ./\nRUN npm install --omit=dev\nCOPY . .\nEXPOSE 3000\nCMD ["node", "server.js"]\n');
      add('api/.dockerignore', 'node_modules\n');
    } else {
      add('api/requirements.txt', pyRequirements(a));
      add('api/services.py', pyServices(a, project));
      if (a.backend === 'fastapi') add('api/main.py', pyFastapi(a)); else add('api/app.py', pyFlask(a));
      if (a.queue) add('api/worker.py', pyWorker(a));
      const cmd = a.backend === 'fastapi' ? '["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]' : '["python", "app.py"]';
      add('api/Dockerfile', 'FROM python:3.12-slim\nENV PYTHONUNBUFFERED=1\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY . .\nEXPOSE 8000\nCMD ' + cmd + '\n');
      add('api/.dockerignore', '__pycache__\n*.db\n');
    }
    if (a.frontend === 'static' || !a.frontend) {
      const s = staticDemo(a, project);
      add('api/public/index.html', s.html); add('api/public/style.css', s.css); add('api/public/app.js', s.js);
    } else if (a.frontend === 'react') addVite(a, add, project);
    else if (a.frontend === 'nextjs') addNext(a, add, project);
    add('docker-compose.yml', composeFile(a));
    add('.env', envFile(a, false));
    add('.env.example', envFile(a, true));
    add('deploy/Caddyfile', '# Replace example.com with your domain. Its DNS A record must point at this server.\nexample.com {\n\treverse_proxy api:' + a.port + '\n}\n');
    add('deploy/compose.caddy.yml', 'services:\n  caddy:\n    image: caddy:2\n    restart: unless-stopped\n    ports: ["80:80", "443:443"]\n    volumes:\n      - ./deploy/Caddyfile:/etc/caddy/Caddyfile\n      - caddy_data:/data\n    depends_on: [api]\n\nvolumes:\n  caddy_data:\n');
  }
  if (a.has.has('ci')) add('.github/workflows/' + (a.backend || a.frontend === 'react' || a.frontend === 'nextjs' ? 'ci.yml' : 'pages.yml'), ciWorkflow(a));
  add('.gitignore', 'node_modules/\n.env\n__pycache__/\n*.db\n.next/\ndist/\n.DS_Store\n');
  files.unshift({ path: 'README.md', content: '' });
  files[0].content = readme(a, state, files);
  return { a, slug, files };
}

    <title>${project.replace(/</g, '&lt;')}</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"><\/script>
  </body>
</html>
`);
  add('web/src/main.jsx', `import React from 'react';
import { createRoot } from 'react-dom/client';
import App from './App.jsx';
import './style.css';

createRoot(document.getElementById('root')).render(
  <React.StrictMode>
    <App wsUrl={location.origin.replace(/^http/, 'ws') + '/ws'} />
  </React.StrictMode>
);
`);
  add('web/src/App.jsx', reactApp(a));
  add('web/src/style.css', REACT_CSS);
}

function addNext(a, add, project) {
  add('web/package.json', JSON.stringify({ name: slugify(project) + '-web', private: true, version: '0.1.0',
    scripts: { dev: 'next dev -p 3001 -H 0.0.0.0', build: 'next build', start: 'next start -p 3001' },
    dependencies: { next: '^14.2.15', react: '^18.3.1', 'react-dom': '^18.3.1' } }, null, 2) + '\n');
  add('web/next.config.js', a.backend ? `// Forwards /api requests to your API so the browser only talks to one origin.
// In Docker, API_ORIGIN is http://api:${a.port}. In production, set it to your API's public URL.
module.exports = {
  async rewrites() {
    const origin = process.env.API_ORIGIN || 'http://localhost:${a.port}';
    return [{ source: '/api/:path*', destination: origin + '/api/:path*' }];
  },
};
` : `module.exports = {};
`);
  add('web/app/layout.js', `import './globals.css';

export const metadata = { title: ${JSON.stringify(project)} };

export default function RootLayout({ children }) {
  return (
    <html lang="en">
      <body>{children}</body>
    </html>
  );
}
`);
  add('web/app/page.js', `'use client';
import App from '../components/App';

export default function Page() {
  return <App wsUrl={process.env.NEXT_PUBLIC_WS_URL || 'ws://localhost:${a.port}/ws'} />;
}
`);
  add('web/components/App.jsx', reactApp(a));
  add('web/app/globals.css', REACT_CSS);
}

function buildPrompt(state) {
  const a = analyze(state.selected);
  const project = (state.name || 'My system').trim() || 'My system';
  const scale = SCALES.find(s => s.id === state.scale) || SCALES[1];
  const L = [];
  L.push('# Build: ' + project, '');
  L.push('I want your help building **' + project + '**' + (state.desc ? ': ' + state.desc.trim() : '.'), '');
  L.push('Expected scale: **' + scale.name + '**. ' + scale.hint + ' Size every decision to this scale. Don’t add infrastructure this scale doesn’t need.', '');
  L.push('## Components I’ve chosen', '');
  LAYERS.forEach(layer => {
    const ids = [...a.has].filter(id => PART[id].layer === layer.id);
    if (!ids.length) return;
    L.push('### ' + layer.name + ' (' + layer.hint.toLowerCase() + ')');
    ids.forEach(id => L.push('- **' + PART[id].name + '**: ' + PART[id].desc + ' Likely hosting: ' + PART[id].host + '.'));
    L.push('');
  });
  L.push('## What I need from you', '');
  const steps = [];
  steps.push('Restate the architecture in a few sentences and draw it as a Mermaid diagram showing how requests and data flow between the components.');
  steps.push('Point out anything missing or unnecessary for this scale, and ask me any questions you need answered before writing code.');
  if (a.backend) {
    steps.push('Generate a complete starter project: ' + (a.frontend ? PART[a.frontend].name + ' front end, ' : '') + PART[a.backend].name + ' API' + (a.primary ? ', ' + PART[a.primary].name + ' as the primary database' : '') + ', and a `docker-compose.yml` that runs every stateful service locally' + (a.services.length ? ' (' + a.services.map(id => PART[id].name).join(', ') + ')' : '') + '.');
    steps.push('Include a `/api/health` endpoint that checks each service, an `.env.example` with every setting, and one small end-to-end feature that proves data flows from the UI to the database and back.');
    if (a.queue) steps.push('Include a background worker that consumes jobs from ' + PART[a.queue].name + ' and an endpoint that enqueues a job.');
  } else {
    steps.push('Generate a complete starter project for the ' + (a.frontend ? PART[a.frontend].name : 'site') + ' with a clear folder structure and one example page.');
  }
  steps.push('Show the full contents of every file with its path, then the exact commands to run it locally.');
  steps.push('Write a README with a step-by-step path from local to hosted using the hosting options above, including how to set environment variables, run database migrations, and set up HTTPS and backups.');
  const later = [...a.has].filter(id => !PART[id].run);
  if (later.length) steps.push('For ' + later.map(id => PART[id].name).join(', ') + ': explain how to add each one, which provider you recommend at this scale, and what it costs to start.');
  steps.forEach((s, i) => L.push((i + 1) + '. ' + s));
  L.push('', '## Constraints', '', '- Keep secrets in environment variables, never in code.', '- Prefer boring, well-documented tools over new ones.', '- Explain any choice that a developer who knows the basics might not recognize.', '');
  return L.join('\n');
}
// ===================== GEN-END =====================

// ===================== UI =====================
const STORE_KEY = 'stackdraft:v1';
function loadState() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && Array.isArray(s.selected)) return s; } catch (e) {}
  return null;
}
const state = loadState() || { name: 'Volunteer sign-ups', scale: 'small', desc: '', selected: ['react', 'express', 'postgres', 'email'] };
state.selected = state.selected.filter(id => PART[id]);
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'style') n.setAttribute('style', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return n;
};
const layerColor = (id) => 'var(--l-' + id + ')';
let lastToggled = null;

function toggle(id) {
  const i = state.selected.indexOf(id);
  if (i >= 0) state.selected.splice(i, 1); else { state.selected.push(id); lastToggled = id; }
  save(); renderBuild();
}

function renderMeta() {
  $('#f-name').value = state.name;
  $('#f-desc').value = state.desc;
  const seg = $('#f-scale'); seg.replaceChildren();
  SCALES.forEach(s => seg.append(el('button', { type: 'button', 'aria-pressed': String(state.scale === s.id), onclick: () => { state.scale = s.id; save(); renderMeta(); renderTitle(); } }, s.name)));
  $('#scale-hint').textContent = (SCALES.find(s => s.id === state.scale) || SCALES[1]).hint;
}

function renderCatalog() {
  const root = $('#catalog'); root.replaceChildren();
  LAYERS.forEach(layer => {
    const parts = PARTS.filter(p => p.layer === layer.id);
    root.append(el('div', { class: 'layer-group', style: '--c:' + layerColor(layer.id) },
      el('h3', {}, layer.name, el('span', {}, layer.hint)),
      el('div', { class: 'parts' }, parts.map(p => el('button', {
        type: 'button', class: 'part', 'aria-pressed': String(state.selected.includes(p.id)), onclick: () => toggle(p.id),
      }, el('span', { class: 'box', 'aria-hidden': 'true' }), el('span', { class: 'part-name' }, p.name),
        el('span', { class: 'badge' + (p.run ? ' runs' : '') }, p.run ? 'Runs locally' : 'Plan only'),
        el('span', { class: 'part-desc' }, p.desc))))));
  });
}

function renderDrawing() {
  const a = analyze(state.selected);
  const root = $('#drawing'); root.replaceChildren();
  LAYERS.forEach(layer => {
    const ids = [...a.has].filter(id => PART[id].layer === layer.id);
    root.append(el('div', { class: 'lane', style: '--c:' + layerColor(layer.id) },
      el('div', { class: 'lane-label' }, layer.name, el('small', {}, layer.hint)),
      el('div', { class: 'chips' }, ids.length ? ids.map(id => {
        const auto = a.added.includes(id);
        return el('span', { class: 'chip' + (auto ? ' auto' : '') + (id === lastToggled ? ' fresh' : ''), title: auto ? 'Added automatically' : PART[id].desc },
          PART[id].name,
          auto ? null : el('button', { type: 'button', 'aria-label': 'Remove ' + PART[id].name, onclick: () => toggle(id) }, '×'));
      }) : el('span', { class: 'empty-lane' }, 'Nothing here yet'))));
  });
  lastToggled = null;
  renderTitle(a);
  const notes = $('#notes'); notes.replaceChildren();
  const runs = [...a.has].filter(id => PART[id].run).length;
  notes.append(el('h3', {}, 'Notes on this design'));
  const items = a.notes.map(n => el('li', { class: n.warn ? 'warn' : '' }, n.text));
  if (!a.has.size) items.push(el('li', {}, 'Pick parts on the left, or open a reference system to start from something real.'));
  else items.push(el('li', {}, runs + ' of ' + a.has.size + ' parts will run in the starter project. The rest are covered in the plan and the README.'));
  notes.append(el('ul', {}, items));
}

function renderTitle(a) {
  a = a || analyze(state.selected);
  const scale = SCALES.find(s => s.id === state.scale) || SCALES[1];
  const tb = $('#titleblock'); tb.replaceChildren();
  const cell = (k, v) => el('div', {}, el('span', {}, k), el('strong', { title: v }, v));
  tb.append(cell('Project', state.name || 'Untitled'), cell('Scale', scale.name), cell('Parts', String(a.has.size)),
    cell('Drawn', new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })));
}

function renderBuild() { renderCatalog(); renderDrawing(); }

// Examples
let tier = 'all';
let currentEx = 'reddit';
const TIERS = [{ id: 'all', name: 'All' }, { id: 'large', name: 'Large' }, { id: 'medium', name: 'Medium' }, { id: 'small', name: 'Small and solo' }];
function renderExamples() {
  const tf = $('#tier-filter'); tf.replaceChildren();
  TIERS.forEach(t => tf.append(el('button', { type: 'button', 'aria-pressed': String(tier === t.id), onclick: () => {
    tier = t.id;
    const first = EXAMPLES.find(e => tier === 'all' || e.tier === tier);
    if (first && !(tier === 'all' || EXAMPLES.find(e => e.id === currentEx).tier === tier)) currentEx = first.id;
    renderExamples();
  } }, t.name)));
  const list = $('#ex-list'); list.replaceChildren();
  TIERS.slice(1).forEach(t => {
    const exs = EXAMPLES.filter(e => e.tier === t.id && (tier === 'all' || tier === t.id));
    if (!exs.length) return;
    list.append(el('div', { class: 'ex-tier' }, t.name));
    exs.forEach(e => list.append(el('button', { type: 'button', class: 'ex-item', 'aria-current': String(currentEx === e.id), onclick: () => { currentEx = e.id; renderExamples(); } },
      el('strong', {}, e.name), el('span', {}, e.kind))));
  });
  const e = EXAMPLES.find(x => x.id === currentEx);
  const d = $('#ex-detail'); d.replaceChildren();
  d.append(el('h2', {}, e.name), el('p', { class: 'scale' }, e.kind + '. ' + e.scale + '.'));
  const lanes = el('div', { class: 'ex-lanes' });
  LAYERS.forEach(layer => {
    const items = e.lanes[layer.id] || [];
    lanes.append(el('div', { class: 'lane', style: '--c:' + layerColor(layer.id) },
      el('div', { class: 'lane-label' }, layer.name),
      items.length ? el('ul', {}, items.map(([n, note]) => el('li', {}, el('strong', {}, n), el('span', {}, ': ' + note))))
        : el('span', { class: 'empty-lane' }, 'Not needed at this size')));
  });
  d.append(lanes);
  d.append(el('div', { class: 'hosting' }, el('h3', {}, 'Where it runs'), el('p', { style: 'margin:0' }, e.hosting)));
  d.append(el('p', {}, el('strong', {}, 'The takeaway: '), e.lesson));
  if (e.tier === 'large') d.append(el('p', { class: 'source' }, 'Assembled from public engineering blogs and conference talks. Systems at this size change constantly, so treat this as a simplified, approximate picture rather than a current blueprint.'));
  else d.append(el('p', { class: 'source' }, 'A representative composite of businesses this size, not a specific company.'));
  d.append(el('div', { class: 'row-actions' },
    el('button', { class: 'btn primary', type: 'button', onclick: () => openInBuilder(e) }, 'Open in the builder')));
}
function openInBuilder(e) {
  state.selected = e.parts.filter(id => PART[id]);
  state.name = e.tier === 'large' ? e.name + '-style ' + e.kind.toLowerCase() : e.name;
  state.scale = e.tier === 'small' ? (e.id === 'portfolio' ? 'solo' : 'small') : e.tier;
  state.desc = e.kind + '.';
  save(); renderMeta(); renderBuild(); showView('build');
}

// Export
let currentFile = 'README.md';
let downloads = null;
function renderExport() {
  const root = $('#export-root'); root.replaceChildren();
  if (!state.selected.length) {
    root.append(el('div', { class: 'panel empty-state' }, el('h2', {}, 'Nothing to export yet'),
      el('p', {}, 'Add a few parts in the builder, or start from a reference system.'),
      el('div', { class: 'row-actions', style: 'justify-content:center' },
        el('button', { class: 'btn primary', type: 'button', onclick: () => showView('build') }, 'Go to the builder'),
        el('button', { class: 'btn', type: 'button', onclick: () => showView('examples') }, 'Browse reference systems'))));
    return;
  }
  const prompt = buildPrompt(state);
  const proj = buildProject(state);
  const a = proj.a;
  if (!proj.files.find(f => f.path === currentFile)) currentFile = 'README.md';

  root.append(el('h2', { style: 'margin-top:24px' }, 'Export ' + (state.name || 'your system')),
    el('p', { class: 'lede' }, 'Hand the design to an AI assistant, or download a project that runs on your machine today and explains how to get it online.'));

  const promptStatus = el('p', { class: 'status', role: 'status' });
  const promptPanel = el('div', { class: 'panel' },
    el('h3', {}, 'Prompt for an AI assistant'),
    el('p', { class: 'stackline', style: 'margin:0' }, 'Paste this into Claude, ChatGPT, or a local model. It describes every part, the scale, and what to produce.'),
    el('pre', { class: 'code prompt', tabindex: '0' }, prompt),
    el('div', { class: 'row-actions' },
      el('button', { class: 'btn primary', type: 'button', onclick: () => copyText(prompt, promptStatus) }, 'Copy prompt'),
      el('button', { class: 'btn', type: 'button', onclick: () => saveFile(proj.slug + '-prompt.md', prompt, promptStatus) }, 'Download as .md')),
    promptStatus);

  const stack = [a.frontend && PART[a.frontend].name, a.backend && PART[a.backend].name, a.primary && PART[a.primary].name].filter(Boolean).join(' + ') || 'Static site';
  const projStatus = el('p', { class: 'status', role: 'status' });
  const preview = el('pre', { class: 'code', tabindex: '0' });
  const list = el('div', { class: 'filelist', role: 'list' });
  const showFile = (p) => {
    currentFile = p;
    preview.textContent = proj.files.find(f => f.path === p).content;
    list.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(b.dataset.path === p)));
  };
  proj.files.forEach(f => list.append(el('button', { type: 'button', role: 'listitem', 'data-path': f.path, onclick: () => showFile(f.path) }, f.path)));
  const runs = [...a.has].filter(id => PART[id].run);
  const plan = [...a.has].filter(id => !PART[id].run);
  const projPanel = el('div', { class: 'panel' },
    el('h3', {}, 'Starter project'),
    el('p', { class: 'stackline', style: 'margin:0' }, el('strong', {}, stack), a.backend ? ', with Docker Compose for every service.' : '.'),
    el('ul', { class: 'included' },
      el('li', {}, 'Runs locally: ' + runs.map(id => PART[id].name).join(', ')),
      plan.length ? el('li', { class: 'muted' }, 'Covered in the README: ' + plan.map(id => PART[id].name).join(', ')) : null),
    el('div', { class: 'files' }, list, preview),
    el('div', { class: 'row-actions' },
      el('button', { class: 'btn primary', type: 'button', onclick: () => downloadZip(proj, projStatus) }, 'Download ' + proj.slug + '.zip'),
      el('button', { class: 'btn', type: 'button', onclick: () => copyText(preview.textContent, projStatus) }, 'Copy this file')),
    projStatus);
  root.append(el('div', { class: 'export' }, promptPanel, projPanel));
  showFile(currentFile);
}

async function copyText(text, status) {
  try { await navigator.clipboard.writeText(text); status.textContent = 'Copied to clipboard.'; }
  catch (e) {
    const ta = el('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (err) {}
    ta.remove();
    status.textContent = ok ? 'Copied to clipboard.' : 'Copying is blocked here. Select the text and copy it manually.';
  }
}

async function saveFile(filename, data, status) {
  if (downloads) {
    try { await downloads.save({ filename, data }); status.textContent = 'Saved ' + filename + '.'; }
    catch (e) {
      if (e && e.code === 'declined') status.textContent = 'Download canceled.';
      else if (e && e.code === 'rate_limited') status.textContent = 'A download prompt is already open. Try again in a moment.';
      else status.textContent = 'Download isn’t available here (' + ((e && e.code) || 'error') + '). Copy the files instead.';
    }
    return;
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const link = el('a', { href: url, download: filename }); document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    status.textContent = 'Downloading ' + filename + '.';
  } catch (e) { status.textContent = 'Download isn’t available here. Copy the files instead.'; }
}

async function downloadZip(proj, status) {
  if (!window.JSZip) { status.textContent = 'The zip library didn’t load. Check your connection and reload.'; return; }
  status.textContent = 'Building the zip…';
  const zip = new JSZip();
  const folder = zip.folder(proj.slug);
  proj.files.forEach(f => folder.file(f.path, f.content));
  const blob = await zip.generateAsync({ type: 'blob' });
  await saveFile(proj.slug + '.zip', blob, status);
}

// Tabs
function showView(v) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  ['build', 'examples', 'export'].forEach(id => { $('#view-' + id).hidden = id !== v; });
  if (v === 'export') renderExport();
  if (v === 'examples') renderExamples();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));
document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => showView(b.dataset.goto)));
$('#f-name').addEventListener('input', (e) => { state.name = e.target.value; save(); renderTitle(); });
$('#f-desc').addEventListener('input', (e) => { state.desc = e.target.value; save(); });
$('#clear').addEventListener('click', () => { state.selected = []; save(); renderBuild(); });

renderMeta();
renderBuild();
renderExamples();
(async () => {
  try { if (window.claude && window.claude.use) downloads = await window.claude.use('downloads'); } catch (e) { downloads = null; }
})();
