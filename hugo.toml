baseURL = "https://thereisaneasierway.com/"
locale = "en-us"
title = "There Is An Easier Way"
theme = "chalk"

# Clean URLs like /posts/my-idea/
[permalinks]
  posts = "/posts/:slug/"

[params]
  description = "Ideas, business pursuits, software projects, and teaching."
  # Shown in the footer
  author = "Ari Almond"
  source = "https://github.com/arionalmond/thereisaneasierway"

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 20
  [[menus.main]]
    name = "Teaching"
    pageRef = "/teaching"
    weight = 30
  [[menus.main]]
    name = "Resources"
    pageRef = "/resources"
    weight = 40
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 41

  # Standalone apps served from static/ — shown apart from the blog sections
  [[menus.apps]]
    name = "CS1"
    url = "/cs1/"
    weight = 10
  [[menus.apps]]
    name = "Tools"
    url = "/tools/"
    weight = 20
  [[menus.apps]]
    name = "Stackdraft"
    url = "/stackdraft/"
    weight = 30

[markup]
  [markup.highlight]
    noClasses = false  # use CSS classes so code blocks follow light/dark mode
  [markup.goldmark.renderer]
    unsafe = true      # allow raw HTML in Markdown when needed

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
